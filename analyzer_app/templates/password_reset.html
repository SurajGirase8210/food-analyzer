{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Reset Password</title>

    <link rel="stylesheet"
          href="{% static 'auth.css' %}">
    <link rel="stylesheet" href="{% static 'responsive.css' %}">

</head>

<body>

<div class="card">

    <h2>Forgot Password</h2>

    <p>Enter your email address</p>

    <form method="POST">

        {% csrf_token %}

        {{ form.email }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

</div>

</body>
</html>
