<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Food Analyzer{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .navbar {
            background: #111827;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .navbar a:hover {
            color: #60a5fa;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div>
            <a href="/">Food Analyzer</a>
        </div>

        <div>
            <a href="/analyze/">Analyze</a>
            <a href="/history/">History</a>
            <a href="/profile/">Profile</a>
            <a href="/dashboard/">Dashboard</a>
            <a href="/logout/">Logout</a>
        </div>
    </div>

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

</body>
</html>
