{% load static %}

<header class="site-header">
  <div class="header-inner container">
    <!-- Logo -->
    <div class="logo">
      <a href="{% url 'home' %}">
        <img src="{% static 'images/logo.png' %}" class="logo-img" />
      </a>
      <a href="{% url 'home' %}" class="brand">Food Analyzer</a>
    </div>

    <!-- Nav links -->
    <nav id="nav-links" class="nav-links">
      <a
        href="{% url 'home' %}"
        class="{% if request.path == '/' %}active{% endif %}"
        >Home</a
      >
      <a
        href="{% url 'analyze' %}"
        class="{% if request.path == '/analyze/' %}active{% endif %}"
        >Analyze</a
      >
      <a
        href="{% url 'about' %}"
        class="{% if request.path == '/about/' %}active{% endif %}"
        >About</a
      >
    </nav>

    <!-- Auth section (RIGHT SIDE) -->
    <div class="auth-section">
      {% if user.is_authenticated %}
      <div class="profile-dropdown">
        <div class="profile-btn" id="profileBtn">👤 {{ user.username }}</div>

        <div id="dropdownMenu" class="dropdown-menu">
          <a href="{% url 'profile' %}">My Profile</a>
          <a href="{% url 'history' %}">My History</a>
          <a href="{% url 'logout' %}">Logout</a>
        </div>
      </div>
      {% else %}
      <a href="{% url 'login' %}" class="btn login-btn">Login</a>
      <a href="{% url 'signup' %}" class="btn signup-btn">Sign Up</a>
      {% endif %}
    </div>
  </div>
</header>
