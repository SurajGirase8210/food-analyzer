{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Analysis Result</title>

    <link rel="stylesheet" href="{% static 'header.css' %}" />
    <link rel="stylesheet" href="{% static 'result.css' %}" />
    <link rel="stylesheet" href="{% static 'responsive.css' %}" />
  </head>
  <body>
    {% include 'header.html' %}

   <!-- RESULT -->
<div id="result" class="result-card hidden">

  <!-- Loader -->
  <div id="loader" class="loader hidden"></div>

  <!-- Uploaded Image -->
  <div class="result-image-box">
    <img id="resultImage" src="" alt="Food Image">
  </div>

  <!-- Food Name -->
  <h2 id="foodTitle">Food Name</h2>

  <!-- Confidence -->
  <div class="confidence-box">
    Confidence:
    <span id="confidenceText">0%</span>
  </div>

  <!-- Calorie Category -->
  <div class="category-badge">
    <span id="categoryText">Medium Calorie</span>
  </div>

  <!-- Health Score -->
  <div class="health-score">
    Health Score:
    <span id="healthScore">0</span>/10
  </div>

  <!-- Nutrition Grid -->
  <div class="nutrition-grid">

    <div class="nutrition-card">
      <h4>Calories</h4>
      <p id="caloriesText">0</p>
    </div>

    <div class="nutrition-card">
      <h4>Protein</h4>
      <p id="proteinText">0g</p>
    </div>

    <div class="nutrition-card">
      <h4>Fat</h4>
      <p id="fatText">0g</p>
    </div>

    <div class="nutrition-card">
      <h4>Carbs</h4>
      <p id="carbsText">0g</p>
    </div>

  </div>

  <!-- AI Insights -->
  <div class="insight-box">

    <h3>AI Insights</h3>

    <ul id="insightsList"></ul>

  </div>

  <!-- Recommendation -->
  <div class="recommend-box">

    <h3>Recommendation</h3>

    <p id="recommendationText"></p>

  </div>

  <!-- Top Predictions -->
  <div class="top-predictions">

    <h3>Top Predictions</h3>

    <div id="topPredictions"></div>

  </div>

</div>

          

          <!-- Action Buttons -->
          <div class="button-group">
            <a href="/analyze/" class="btn-primary"> Analyze Another </a>

            <a href="/history/" class="btn-secondary"> View History </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
