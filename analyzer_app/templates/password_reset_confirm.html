{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Set New Password</title>

    <link rel="stylesheet"
          href="{% static 'auth.css' %}">
    <link rel="stylesheet"
          href="{% static 'responsive.css' %}">

</head>

<body>

<div class="card">

    <h2>Set New Password</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>
</html>
